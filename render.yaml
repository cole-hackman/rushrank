services:
  - type: web
    name: rushrank-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r python_server/requirements.txt
    startCommand: uvicorn python_server.main:app --host 0.0.0.0 --port $PORT
    # /health/db runs SELECT 1, so Render only routes traffic to an instance
    # that can reach the database. /health only checks the pool object exists.
    healthCheckPath: /health/db
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # The domain people visit. Used for links in emails and QR codes, and
      # always allowed as a CORS origin.
      - key: PUBLIC_SITE_URL
        value: https://rushrank.vercel.app
      # Optional. Error reports go to Sentry when set; nothing is sent otherwise.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

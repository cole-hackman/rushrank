name: Warm Backend

on:
  schedule:
    # Run every 10 minutes to keep Render backend warm
    - cron: '*/10 * * * *'
  # Also allow manual triggering
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          echo "Pinging backend health endpoint..."
          curl -f -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://rushrank-backend.onrender.com/health || echo "Backend ping completed (may be spinning up)"
          echo "Backend warming complete"

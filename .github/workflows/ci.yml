name: CI

# Runs on every branch. The previous filter (main, feat/**, fix/**) meant most
# working branches got no CI at all, including every branch this project's
# tooling creates.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # A real Postgres. The 81 unit tests in this repo are mock-based and cannot
    # detect a missing table or column, which is why a schema that matched
    # neither committed definition reached production. See docs/AUDIT-2026-08.md.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install from the requirements file rather than a hand-maintained list,
      # which had already drifted from python_server/requirements.txt.
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_server/requirements.txt
          pip install -r python_server/requirements-dev.txt

      - name: Verify migrations apply to an empty database
        run: |
          psql "$TEST_DATABASE_URL" -c 'DROP DATABASE IF EXISTS migration_check;'
          psql "$TEST_DATABASE_URL" -c 'CREATE DATABASE migration_check;'
          for f in supabase/migrations/*.sql; do
            echo "--- $f"
            psql "${TEST_DATABASE_URL%/*}/migration_check" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Unit tests
        working-directory: python_server
        run: pytest -q -m "not integration"

      - name: Integration tests (real Postgres)
        working-directory: python_server
        run: pytest -q -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
